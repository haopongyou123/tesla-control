name: CI Full Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/haopongyou123/tesla-control

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  test_and_deploy:
    name: Run Tests & Deploy
    needs: build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run unit tests (API)
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

      - name: Playwright E2E
        run: pnpm exec playwright test

      - name: Cypress E2E (requires Docker services)
        run: |
          docker compose -f docker-compose.yml up -d kafka zookeeper
          pnpm run cypress:run

      - name: k6 Performance
        run: | 
          npm i -g k6
          k6 run tests/performance/api_k6.js

      - name: Set up Kubeconfig
        run: |
          echo ${{ secrets.KUBE_CONFIG_DATA }} | base64 -d > ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Helm upgrade/install
        run: | 
          helm upgrade --install tesla-control ./k8s/tesla-control \
            --namespace default \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set image.tag=latest \
            --set image.pullPolicy=IfNotPresent \
            --create-namespace

  cleanup:
    name: Cleanup Docker Daemon (Optional)
    needs: test_and_deploy
    runs-on: ubuntu-latest
    steps:
      - name: Docker System Prune
        run: docker system prune -f
